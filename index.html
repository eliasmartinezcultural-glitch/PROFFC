<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<meta name="description" content="YO FUTBOLISTA — una experiencia de fútbol de equipo.">
<title>YO FUTBOLISTA · 9 FC</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn" data-nav="club" aria-label="Abrir club">☰</button>
    <div class="brand"><span class="brand-mark">9</span><span>YO FUTBOLISTA</span></div>
    <button class="icon-btn" id="soundToggle" aria-label="Activar o desactivar sonido">⌁</button>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button data-nav="club"><span>⌂</span><small>Club</small></button>
    <button data-nav="team"><span>◉</span><small>Equipo</small></button>
    <button data-nav="train"><span>✦</span><small>Entrenar</small></button>
    <button data-nav="player"><span>10</span><small>Mi fútbol</small></button>
    <button data-nav="match"><span>⚽</span><small>Matchday</small></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
